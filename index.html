<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a1e44">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ArchiPrépa</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2433;--mut:#667085;--acc:#1f3a5f;--accink:#fff;--ok:#1a7f4b;--ko:#b42318;--line:#e4e0d6}
@media(prefers-color-scheme:dark){:root{--bg:#12161f;--card:#1b2130;--ink:#eef0f5;--mut:#9aa3b5;--acc:#8fb4ee;--accink:#12161f;--line:#2b3347;--ok:#4cc38a;--ko:#f97066}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px;z-index:5}
header h1{font-size:18px;margin:0;flex:1}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.btn{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.btn:active{transform:scale(.99)}
.row{display:flex;align-items:center;gap:12px}
.ico{font-size:28px}
.mut{color:var(--mut);font-size:14px}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.pri{background:var(--acc);color:var(--accink);border:0;border-radius:12px;padding:14px;font:inherit;font-weight:600;width:100%;cursor:pointer;margin-top:8px}
.back{background:none;border:0;color:var(--acc);font:inherit;font-weight:600;cursor:pointer;padding:4px 0}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;padding:8px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.tabs button.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.opt.ko{border-color:var(--ko);background:color-mix(in srgb,var(--ko) 15%,var(--card))}
.exp{font-size:14px;color:var(--mut);margin-top:8px}
h2{font-size:20px;margin:4px 0 12px}
h3{font-size:16px;margin:16px 0 6px}
ul{padding-left:20px}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--acc)}
svg text{fill:var(--ink);font:13px system-ui}
.big{font-size:42px;font-weight:700;text-align:center;margin:12px 0}

.srch{width:100%;padding:12px 14px;margin-bottom:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
.srch:focus{outline:2px solid var(--acc);outline-offset:1px}
.ask{margin-top:0;margin-bottom:12px}
.sec{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font:inherit;cursor:pointer}
.sec.wide{width:100%;margin-top:8px}
.rowb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0}
.rowb .mut{min-width:0;overflow-wrap:anywhere}
#chat{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.msg{max-width:92%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid var(--line);background:var(--card)}
.msg.me{align-self:flex-end;background:var(--acc);color:var(--accink);border-color:var(--acc)}
textarea{width:100%;resize:vertical;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
textarea:focus{outline:2px solid var(--acc);outline-offset:1px}
:root[data-accent="vert"]{--acc:#1d6b4a;--accink:#ffffff}
:root[data-accent="violet"]{--acc:#5b3fa6;--accink:#ffffff}
:root[data-accent="orange"]{--acc:#b4501a;--accink:#ffffff}
:root[data-accent="rose"]{--acc:#a8326b;--accink:#ffffff}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"])[data-accent="vert"]{--acc:#5cc59a;--accink:#0f1824}
:root:not([data-theme="light"])[data-accent="violet"]{--acc:#b39bf0;--accink:#0f1824}
:root:not([data-theme="light"])[data-accent="orange"]{--acc:#f0a070;--accink:#0f1824}
:root:not([data-theme="light"])[data-accent="rose"]{--acc:#f08cb9;--accink:#0f1824}
}
:root[data-theme="dark"][data-accent="vert"]{--acc:#5cc59a;--accink:#0f1824}
:root[data-theme="dark"][data-accent="violet"]{--acc:#b39bf0;--accink:#0f1824}
:root[data-theme="dark"][data-accent="orange"]{--acc:#f0a070;--accink:#0f1824}
:root[data-theme="dark"][data-accent="rose"]{--acc:#f08cb9;--accink:#0f1824}

label{display:block;font-weight:600;margin-bottom:4px}
.lbl{font-weight:600;margin:14px 0 6px}
.hello{margin:0 0 12px}
.sw{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 16px}
.swb{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.swb.on{outline:3px solid var(--ink);outline-offset:2px}
.swb:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.err{color:var(--ko);font-size:14px;min-height:1.2em}
.ok{color:var(--ok);font-size:14px;min-height:1.2em}
header .sec{padding:6px 12px;font-size:14px}

.linkb{display:block;margin:16px auto 8px;background:none;border:0;color:var(--mut);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer;padding:8px}

.avatar{display:block;width:140px;height:140px;border-radius:50%;object-fit:cover;margin:0 auto 14px;border:3px solid var(--line);background:var(--card)}

.hlogo{width:32px;height:32px;border-radius:8px;flex:none}
.logo-big{display:block;width:112px;height:112px;margin:0 auto 8px;border-radius:24px}
.ctr{text-align:center}
.creator{display:flex;align-items:center;gap:14px;margin:6px 0 10px}
.avatar.sm{width:72px;height:72px;margin:0;flex:none}

.offb{font-size:12px;padding:3px 8px;border-radius:99px;border:1px solid var(--ko);color:var(--ko);white-space:nowrap}
</style>
</head>
<body>
<header><img class="hlogo" id="hlogo" alt="" width="32" height="32"><h1 id="t">ArchiPrépa</h1><span class="offb" id="offb" hidden>Hors ligne</span><button class="sec" id="gear" type="button" hidden>Réglages</button></header>
<main id="app"></main>

<script>
const EPURE=`<svg viewBox="0 0 300 220" width="100%" role="img" aria-label="Épure d'un point">
<line x1="10" y1="110" x2="290" y2="110" stroke="currentColor" stroke-width="2"/>
<text x="268" y="104">LT</text>
<line x1="150" y1="50" x2="150" y2="170" stroke="currentColor" stroke-dasharray="4 4"/>
<circle cx="150" cy="50" r="4" fill="currentColor"/><circle cx="150" cy="170" r="4" fill="currentColor"/>
<text x="158" y="48">a′ (proj. verticale)</text><text x="158" y="178">a (proj. horizontale)</text>
<line x1="100" y1="50" x2="100" y2="110" stroke="currentColor"/><text x="30" y="85">cote</text>
<line x1="100" y1="110" x2="100" y2="170" stroke="currentColor"/><text x="14" y="145">éloignement</text>
<text x="158" y="130" style="font-size:11px">ligne de rappel ⟂ LT</text>
</svg>`;

const DATA=[
{id:'chimie',nom:'Chimie',ico:'⚗️',desc:'Atomes, liaisons, mole, matériaux de construction',lessons:[
{t:'L\'atome et le tableau périodique',niv:'Prépa',body:`
<p>L'atome est formé d'un <b>noyau</b> (protons chargés +, neutrons sans charge) entouré d'<b>électrons</b> (charge −) répartis en couches.</p>
<ul><li><b>Z</b> = nombre de protons = nombre d'électrons (atome neutre)</li><li><b>A</b> = protons + neutrons</li></ul>
<p>Le tableau périodique classe les éléments par <b>Z croissant</b>. Les éléments d'une même colonne ont des propriétés proches (même nombre d'électrons de valence).</p>
<p><b>Exemple :</b> le carbone 12 a Z = 6 et A = 12, donc 12 − 6 = 6 neutrons.</p>`,
q:[{q:'Un atome neutre a Z = 8. Combien a-t-il d\'électrons ?',o:['4','8','16'],a:1,e:'Atome neutre : électrons = protons = Z = 8.'},
{q:'Le carbone 12 (Z = 6) a combien de neutrons ?',o:['6','12','18'],a:0,e:'A − Z = 12 − 6 = 6.'},
{q:'Le tableau périodique est classé par…',o:['masse alphabétique','Z croissant','couleur'],a:1,e:'Les éléments sont rangés par numéro atomique Z croissant.'}]},
{t:'Les liaisons chimiques',niv:'Prépa',body:`
<ul><li><b>Ionique</b> : transfert d'électrons entre un métal et un non-métal (ex. NaCl).</li>
<li><b>Covalente</b> : partage d'électrons entre non-métaux (ex. H₂O, CO₂).</li>
<li><b>Métallique</b> : électrons libres qui circulent entre les atomes (ex. acier, cuivre). C'est ce qui rend les métaux conducteurs et malléables.</li></ul>`,
q:[{q:'Quel type de liaison dans NaCl ?',o:['Ionique','Covalente','Métallique'],a:0,e:'Le sodium cède un électron au chlore : liaison ionique.'},
{q:'Pourquoi les métaux conduisent-ils l\'électricité ?',o:['Ils sont lourds','Leurs électrons sont libres','Ils sont brillants'],a:1,e:'Les électrons libres de la liaison métallique transportent le courant.'},
{q:'Quelle liaison dans H₂O ?',o:['Ionique','Métallique','Covalente'],a:2,e:'L\'oxygène et l\'hydrogène partagent des électrons.'}]},
{t:'La mole et la masse molaire',niv:'Prépa',body:`
<p>La quantité de matière (en <b>mol</b>) se calcule avec :</p>
<p style="text-align:center"><b>n = m / M</b></p>
<p>n en mol, m en g, M (masse molaire) en g/mol.</p>
<p><b>Exemple :</b> M(H) = 1 et M(O) = 16, donc M(H₂O) = 2×1 + 16 = 18 g/mol. Pour 36 g d'eau : n = 36 / 18 = 2 mol.</p>`,
q:[{q:'M(CO₂) avec M(C)=12 et M(O)=16 ?',o:['28 g/mol','44 g/mol','56 g/mol'],a:1,e:'12 + 2×16 = 44 g/mol.'},
{q:'Combien de moles dans 88 g de CO₂ ?',o:['1 mol','2 mol','4 mol'],a:1,e:'n = 88 / 44 = 2 mol.'},
{q:'Quelle masse pour 3 mol d\'eau (M = 18 g/mol) ?',o:['54 g','6 g','21 g'],a:0,e:'m = n × M = 3 × 18 = 54 g.'}]},
{t:'Chimie des matériaux de construction',niv:'L1',body:`
<ul><li><b>Ciment</b> : calcaire + argile cuits vers 1450 °C donnent le clinker, broyé avec un peu de gypse.</li>
<li><b>Béton</b> = ciment + eau + sable + gravier.</li>
<li>Le béton durcit par <b>hydratation du ciment</b> (réaction chimique avec l'eau), pas par simple séchage.</li>
<li><b>Rouille</b> : oxydation du fer en présence d'eau et d'oxygène. Dans le béton armé, l'alcalinité du béton protège l'acier.</li></ul>`,
q:[{q:'Composition du béton ?',o:['Ciment + eau + sable + gravier','Ciment + sable seulement','Argile + eau'],a:0,e:'Ciment, eau, sable (granulats fins) et gravier (granulats gros).'},
{q:'La rouille est une…',o:['dissolution','oxydation du fer','fusion'],a:1,e:'Le fer s\'oxyde avec l\'eau et l\'oxygène.'},
{q:'Le béton durcit grâce à…',o:['l\'évaporation seule','l\'hydratation du ciment','le froid'],a:1,e:'C\'est une réaction chimique entre le ciment et l\'eau.'}]}
]},
{id:'dessin',nom:'Dessin descriptif',ico:'📐',desc:'Géométrie descriptive : méthode de Monge, épures',lessons:[
{t:'La méthode de Monge',niv:'Prépa',svg:EPURE,body:`
<p>On projette orthogonalement un objet sur deux plans perpendiculaires : le plan <b>horizontal H</b> et le plan <b>vertical V</b>, qui se coupent selon la <b>ligne de terre (LT)</b>.</p>
<p>Un point A donne deux projections : <b>a</b> sur H et <b>a′</b> sur V. On rabat H autour de LT pour obtenir l'<b>épure</b> sur une seule feuille.</p>
<ul><li><b>Cote</b> = distance de A à H, mesurée de a′ à LT.</li>
<li><b>Éloignement</b> = distance de A à V, mesurée de a à LT.</li>
<li>a et a′ sont sur une même perpendiculaire à LT : la <b>ligne de rappel</b>.</li></ul>
<p class="mut">Convention (premier dièdre) : a′ au-dessus de LT, a en dessous.</p>`,
q:[{q:'La ligne de rappel est…',o:['parallèle à LT','perpendiculaire à LT','inclinée à 45°'],a:1,e:'a et a′ sont alignés sur une perpendiculaire à LT.'},
{q:'La cote d\'un point se mesure entre…',o:['a et LT','a′ et LT','a et a′'],a:1,e:'La cote est la distance au plan horizontal : de a′ à LT.'},
{q:'Un point situé sur le plan horizontal H a une cote…',o:['nulle','égale à son éloignement','infinie'],a:0,e:'Il est à distance 0 de H, donc a′ est sur LT.'}]},
{t:'Les droites en épure',niv:'Prépa',body:`
<ul><li><b>Horizontale</b> (parallèle à H) : sa projection verticale est parallèle à LT, et sa projection horizontale est en vraie grandeur.</li>
<li><b>Frontale</b> (parallèle à V) : sa projection horizontale est parallèle à LT, et sa projection verticale est en vraie grandeur.</li>
<li><b>Verticale</b> (perpendiculaire à H) : sa projection horizontale est un point, sa projection verticale est perpendiculaire à LT en vraie grandeur.</li></ul>`,
q:[{q:'Une droite horizontale a sa projection verticale…',o:['perpendiculaire à LT','parallèle à LT','réduite à un point'],a:1,e:'Cote constante : a′b′ est parallèle à LT.'},
{q:'Une droite frontale a sa projection horizontale…',o:['parallèle à LT','réduite à un point','perpendiculaire à LT'],a:0,e:'Éloignement constant : ab est parallèle à LT.'},
{q:'Une droite verticale se projette sur H en…',o:['un segment','un point','une courbe'],a:1,e:'Elle est perpendiculaire à H : sa projection horizontale est un point.'}]},
{t:'Les plans et leurs traces',niv:'L1',body:`
<p>Un plan est défini par ses <b>traces</b> : l'intersection avec H (<b>trace horizontale</b>) et avec V (<b>trace verticale</b>).</p>
<p>Si le plan n'est pas parallèle à LT, ses deux traces se coupent <b>sur la ligne de terre</b>.</p>`,
q:[{q:'Où se coupent les deux traces d\'un plan (non parallèle à LT) ?',o:['Sur LT','Sur H seulement','Elles ne se coupent jamais'],a:0,e:'Les traces se rencontrent en un point de la ligne de terre.'},
{q:'La trace horizontale est l\'intersection du plan avec…',o:['V','H','LT'],a:1,e:'Trace horizontale = plan ∩ H.'}]}
]},
{id:'maths',nom:'Maths de l\'architecture',ico:'🧮',desc:'Trigonométrie, surfaces, volumes, échelles',lessons:[
{t:'Pythagore, trigonométrie et pente',niv:'Prépa',body:`
<p><b>Pythagore</b> : dans un triangle rectangle, c² = a² + b².</p>
<p><b>Tangente</b> : tan α = côté opposé / côté adjacent.</p>
<p><b>Pente d'un toit :</b> demi-portée 4 m, hauteur 1,5 m → tan α = 1,5 / 4 = 0,375, donc α ≈ 20,6°.</p>
<p><b>Pente en %</b> = hauteur / longueur × 100. Exemple : 1 m de dénivelé sur 10 m = 10 %.</p>`,
q:[{q:'Triangle rectangle de côtés 3 et 4 : hypoténuse ?',o:['5','7','6'],a:0,e:'√(9 + 16) = 5.'},
{q:'Toit : demi-portée 4 m, hauteur 1,5 m. tan α = ?',o:['0,375','2,67','5,5'],a:0,e:'1,5 / 4 = 0,375.'},
{q:'1 m de dénivelé sur 10 m de longueur, pente ?',o:['1 %','10 %','100 %'],a:1,e:'1 / 10 × 100 = 10 %.'}]},
{t:'Surfaces et volumes',niv:'Prépa',body:`
<ul><li>Rectangle : L × l &nbsp;|&nbsp; Triangle : b × h / 2 &nbsp;|&nbsp; Cercle : π r²</li>
<li>Prisme / dalle : surface de base × hauteur</li>
<li>Cylindre : π r² h &nbsp;|&nbsp; Pyramide : ⅓ × base × h</li></ul>
<p><b>Exemple :</b> dalle de 5 m × 4 m, épaisseur 0,15 m → 5 × 4 × 0,15 = 3 m³ de béton.</p>`,
q:[{q:'Dalle 5 m × 4 m × 0,15 m : volume ?',o:['3 m³','20 m³','0,75 m³'],a:0,e:'5 × 4 × 0,15 = 3 m³.'},
{q:'Aire d\'un cercle de rayon 2 m ?',o:['4 m²','≈ 12,57 m²','≈ 6,28 m²'],a:1,e:'π × 2² = 4π ≈ 12,57 m².'},
{q:'Pyramide : base 6 m², hauteur 3 m. Volume ?',o:['18 m³','9 m³','6 m³'],a:2,e:'⅓ × 6 × 3 = 6 m³.'}]},
{t:'Les échelles',niv:'Prépa',body:`
<p>Échelle <b>1/50</b> : 1 cm sur le plan = 50 cm dans la réalité.</p>
<p>Plan = réel ÷ dénominateur. Réel = plan × dénominateur.</p>
<p><b>Exemple :</b> un mur de 6 m à l'échelle 1/100 mesure 600 / 100 = 6 cm sur le plan.</p>`,
q:[{q:'6 m réels à l\'échelle 1/100 font combien sur le plan ?',o:['6 cm','60 cm','0,6 cm'],a:0,e:'600 cm / 100 = 6 cm.'},
{q:'8 cm sur un plan au 1/200 : longueur réelle ?',o:['1,6 m','16 m','160 m'],a:1,e:'8 × 200 = 1600 cm = 16 m.'}]}
]}
];

/* ===== Contenu supplémentaire ===== */
DATA[0].lessons.push(
{t:"Équations chimiques et équilibrage",niv:"Prépa",body:`
<p>Dans une réaction chimique, les atomes ne disparaissent pas : leur nombre est le même avant et après. On <b>équilibre</b> l'équation avec des coefficients devant chaque formule.</p>
<p><b>Exemple :</b> 2 H₂ + O₂ → 2 H₂O. À gauche : 4 H et 2 O. À droite : 4 H et 2 O. L'équation est équilibrée.</p>
<p><b>Combustion du méthane :</b> CH₄ + 2 O₂ → CO₂ + 2 H₂O.</p>`,
q:[{q:"Dans une équation équilibrée, on conserve…",o:["les molécules","les atomes","les couleurs"],a:1,e:"Le nombre de chaque sorte d'atome est identique des deux côtés."},
{q:"CH₄ + ? O₂ → CO₂ + 2 H₂O. Quel coefficient devant O₂ ?",o:["1","2","4"],a:1,e:"À droite il y a 2 + 2 = 4 atomes d'oxygène, donc 2 O₂ à gauche."},
{q:"2 H₂ + O₂ → ? H₂O. Quel coefficient devant H₂O ?",o:["1","2","3"],a:1,e:"4 atomes d'hydrogène à gauche donnent 2 molécules H₂O (2 × 2 = 4)."}]},
{t:"Acides, bases et pH",niv:"Prépa",body:`
<p>Le <b>pH</b> mesure l'acidité d'une solution, sur une échelle de 0 à 14 (à 25 °C).</p>
<ul><li>pH &lt; 7 : solution <b>acide</b></li><li>pH = 7 : solution <b>neutre</b> (eau pure)</li><li>pH &gt; 7 : solution <b>basique</b></li></ul>
<p>Chaque unité de pH correspond à un facteur 10 sur la concentration en ions H₃O⁺.</p>
<p><b>En construction :</b> le béton frais est très basique (pH autour de 12 à 13). La pluie acide attaque le calcaire et le marbre.</p>`,
q:[{q:"Une solution de pH 3 est…",o:["acide","neutre","basique"],a:0,e:"Un pH inférieur à 7 indique une solution acide."},
{q:"Une solution de pH 5 est… par rapport à une solution de pH 6.",o:["10 fois plus acide","2 fois plus acide","10 fois moins acide"],a:0,e:"Une unité de pH correspond à un facteur 10."},
{q:"La pluie acide attaque surtout…",o:["le calcaire et le marbre","l'acier inoxydable seulement","le verre uniquement"],a:0,e:"Le carbonate de calcium réagit avec les acides."}]},
{t:"États de la matière et changements d'état",niv:"Prépa",body:`
<p>La matière existe sous trois états : <b>solide</b>, <b>liquide</b> et <b>gaz</b>.</p>
<ul><li>Solide → liquide : <b>fusion</b></li><li>Liquide → gaz : <b>vaporisation</b></li><li>Gaz → liquide : <b>condensation</b></li><li>Liquide → solide : <b>solidification</b></li></ul>
<p>À la pression atmosphérique normale, l'eau gèle à 0 °C et bout à 100 °C.</p>
<p><b>À retenir en construction :</b> l'eau augmente de volume en gelant. Dans les pays froids, l'eau qui gèle dans une pierre poreuse ou un tuyau peut les fissurer.</p>`,
q:[{q:"Le passage de solide à liquide s'appelle…",o:["la fusion","la condensation","la sublimation"],a:0,e:"Solide vers liquide : fusion."},
{q:"À pression normale, l'eau bout à…",o:["50 °C","100 °C","212 °C"],a:1,e:"L'eau bout à 100 °C à la pression atmosphérique normale."},
{q:"Quand l'eau gèle, son volume…",o:["diminue","augmente","ne change pas"],a:1,e:"La glace occupe un peu plus de volume que l'eau liquide."}]}
);

DATA[1].lessons.push(
{t:"Plan, coupe et façade",niv:"Prépa",body:`
<p>Un projet d'architecture se décrit avec plusieurs vues, toutes obtenues par projection orthogonale :</p>
<ul><li><b>Plan</b> : coupe horizontale du bâtiment à environ 1 m du sol, vue de dessus. Il montre les murs, les portes, les fenêtres, les pièces.</li>
<li><b>Coupe</b> : coupe verticale. Elle montre les hauteurs, les niveaux, les planchers et la toiture.</li>
<li><b>Façade (élévation)</b> : vue de l'extérieur d'un côté du bâtiment, sans coupe.</li>
<li><b>Plan de masse</b> : vue de dessus de l'ensemble du terrain avec les bâtiments et leur environnement.</li></ul>`,
q:[{q:"Le plan d'un bâtiment est…",o:["une coupe horizontale vue de dessus","une vue de face de l'extérieur","une coupe verticale"],a:0,e:"On coupe le bâtiment horizontalement et on regarde d'en haut."},
{q:"Quelle vue montre les hauteurs des étages ?",o:["Le plan de masse","La coupe","Le plan"],a:1,e:"La coupe verticale montre les niveaux et les hauteurs."},
{q:"La façade montre…",o:["l'aspect extérieur d'un côté","l'intérieur des pièces","le terrain vu du ciel"],a:0,e:"C'est l'élévation de l'extérieur."}]},
{t:"La perspective",niv:"Prépa",body:`
<p>La perspective représente la profondeur sur une feuille plate.</p>
<ul><li><b>Ligne d'horizon</b> : elle est à la hauteur des yeux de l'observateur.</li>
<li><b>Point de fuite</b> : point de l'horizon où se rejoignent les lignes parallèles qui s'éloignent.</li>
<li><b>Perspective à un point de fuite</b> (frontale) : les lignes perpendiculaires au tableau convergent vers un seul point.</li>
<li><b>Perspective à deux points de fuite</b> (d'angle) : on voit le bâtiment par un angle, avec deux points de fuite sur la ligne d'horizon.</li></ul>`,
q:[{q:"La ligne d'horizon est située…",o:["à la hauteur des yeux","au sol","au sommet du bâtiment"],a:0,e:"Elle correspond à la hauteur des yeux de l'observateur."},
{q:"Une vue d'angle d'un bâtiment utilise…",o:["un point de fuite","deux points de fuite","aucun point de fuite"],a:1,e:"Deux familles de lignes fuyantes donnent deux points de fuite."},
{q:"Où se trouvent les points de fuite ?",o:["Sur la ligne d'horizon","Sous le sol","Au centre de la feuille toujours"],a:0,e:"Ils sont sur la ligne d'horizon."}]},
{t:"L'axonométrie",niv:"L1",body:`
<p>L'axonométrie représente un objet en volume avec des lignes parallèles (sans point de fuite).</p>
<ul><li><b>Isométrique</b> : les trois axes font 120° entre eux et on utilise la même échelle sur les trois.</li>
<li><b>Cavalière</b> : la face avant est dessinée en vraie grandeur. Les lignes de fuite partent souvent à 45° et sont raccourcies (par exemple coefficient 0,5).</li></ul>
<p><b>Exemple :</b> une profondeur réelle de 4 m, dessinée en cavalière avec le coefficient 0,5, se trace comme 2 m.</p>`,
q:[{q:"En isométrique, l'angle entre les axes est de…",o:["90°","120°","45°"],a:1,e:"Les trois axes sont espacés de 120°."},
{q:"En perspective cavalière, quelle face est en vraie grandeur ?",o:["La face avant","La face arrière seulement","Aucune"],a:0,e:"La face parallèle au plan du dessin n'est pas déformée."},
{q:"Profondeur de 4 m, coefficient 0,5 : longueur tracée ?",o:["2 m","4 m","8 m"],a:0,e:"4 × 0,5 = 2."}]}
);

DATA[2].lessons.push(
{t:"Cercles, périmètres et π",niv:"Prépa",body:`
<ul><li>Périmètre d'un cercle : <b>2 π r</b> (ou π × diamètre)</li>
<li>Périmètre d'un rectangle : <b>2 (L + l)</b></li>
<li>π ≈ 3,14</li></ul>
<p><b>Exemple :</b> une colonne de diamètre 0,5 m a une circonférence de π × 0,5 ≈ 1,57 m.</p>`,
q:[{q:"Circonférence d'un cercle de rayon 3 m ?",o:["≈ 9,42 m","≈ 18,85 m","≈ 28,3 m"],a:1,e:"2 × π × 3 ≈ 18,85 m."},
{q:"Colonne de diamètre 0,5 m : circonférence ?",o:["≈ 1,57 m","≈ 0,79 m","≈ 3,14 m"],a:0,e:"π × 0,5 ≈ 1,57 m."},
{q:"Périmètre d'un rectangle de 8 m sur 5 m ?",o:["13 m","26 m","40 m"],a:1,e:"2 × (8 + 5) = 26 m."}]},
{t:"Proportionnalité et pourcentages",niv:"Prépa",body:`
<p><b>Règle de trois :</b> si 5 m² de mur demandent 60 briques, alors 1 m² demande 60 / 5 = 12 briques, et 12 m² demandent 12 × 12 = 144 briques.</p>
<p><b>Pourcentages :</b> augmenter de 15 %, c'est multiplier par 1,15. Diminuer de 20 %, c'est multiplier par 0,8.</p>
<p><b>En chantier :</b> on prévoit souvent environ 10 % de pertes (coupes, casse) sur le carrelage.</p>`,
q:[{q:"5 m² de mur = 60 briques. Pour 12 m² ?",o:["120 briques","144 briques","72 briques"],a:1,e:"60 / 5 = 12 briques par m², donc 12 × 12 = 144."},
{q:"100 m² augmentés de 15 % donnent…",o:["115 m²","150 m²","110 m²"],a:0,e:"100 × 1,15 = 115."},
{q:"50 m² de carrelage + 10 % de pertes : quantité à acheter ?",o:["55 m²","60 m²","51 m²"],a:0,e:"50 × 1,10 = 55 m²."}]},
{t:"Thalès et triangles semblables",niv:"L1",body:`
<p><b>Théorème de Thalès :</b> si deux droites sont coupées par des parallèles, les longueurs correspondantes sont proportionnelles.</p>
<p>Des <b>triangles semblables</b> ont les mêmes angles : leurs côtés sont dans le même rapport.</p>
<p><b>Application :</b> mesurer la hauteur d'un bâtiment avec son ombre. Une personne de 1,8 m a une ombre de 3 m. À la même heure, l'ombre du bâtiment mesure 50 m. Le rapport est 1,8 / 3 = 0,6, donc la hauteur est 0,6 × 50 = 30 m.</p>`,
q:[{q:"Condition pour appliquer Thalès :",o:["des droites parallèles","des angles droits seulement","des cercles"],a:0,e:"Il faut des droites parallèles qui coupent deux autres droites."},
{q:"Ombre du bâtiment : 50 m. Personne de 1,8 m, ombre 3 m. Hauteur du bâtiment ?",o:["27 m","30 m","90 m"],a:1,e:"(1,8 / 3) × 50 = 30 m."},
{q:"Des triangles semblables ont…",o:["les mêmes angles","la même aire","les mêmes côtés"],a:0,e:"Mêmes angles, côtés proportionnels."}]},
{t:"Équations du premier degré",niv:"L1",body:`
<p>Pour résoudre une équation comme <b>3x + 5 = 20</b>, on isole x : 3x = 15, donc x = 5.</p>
<p><b>Problème type :</b> un rectangle a une longueur deux fois plus grande que sa largeur et un périmètre de 36 m. Si l = largeur, alors 2 (2l + l) = 36, donc 6l = 36, l = 6 m et L = 12 m.</p>`,
q:[{q:"Résous 2x − 4 = 10.",o:["x = 3","x = 7","x = 12"],a:1,e:"2x = 14, donc x = 7."},
{q:"Résous x / 4 = 6.",o:["x = 24","x = 1,5","x = 10"],a:0,e:"x = 6 × 4 = 24."},
{q:"Rectangle : L = 2l, périmètre 36 m. Quelle est la largeur ?",o:["6 m","9 m","12 m"],a:0,e:"6l = 36, donc l = 6 m."}]}
);

DATA.push(
{id:"physique",nom:"Physique",ico:"⚙️",desc:"Forces, pression, moments, chaleur",lessons:[
{t:"Forces et équilibre",niv:"Prépa",body:`
<p>Une force se mesure en <b>newtons (N)</b>. Le <b>poids</b> est la force d'attraction de la Terre : <b>P = m × g</b>, avec g ≈ 9,8 N/kg (on prend souvent 10).</p>
<p><b>Exemple :</b> une personne de 50 kg pèse environ 50 × 9,8 = 490 N.</p>
<p>Un objet est à l'équilibre quand la somme des forces qui s'exercent sur lui est nulle. Un meuble posé au sol : son poids vers le bas est compensé par la réaction du sol vers le haut.</p>`,
q:[{q:"L'unité de force est…",o:["le newton","le kilogramme","le pascal"],a:0,e:"La force se mesure en newtons (N)."},
{q:"Poids d'une masse de 50 kg (g = 9,8 N/kg) ?",o:["50 N","490 N","5 N"],a:1,e:"P = 50 × 9,8 = 490 N."},
{q:"À l'équilibre, la somme des forces est…",o:["nulle","maximale","égale au poids"],a:0,e:"Les forces se compensent."}]},
{t:"Pression et contrainte",niv:"Prépa",body:`
<p><b>Pression = force / surface</b> : P = F / S. Unité : le pascal (Pa), 1 Pa = 1 N/m².</p>
<p><b>Exemple :</b> 10 000 N répartis sur 2 m² donnent 5 000 Pa.</p>
<p><b>Pourquoi les fondations sont larges :</b> pour une même charge, une surface plus grande donne une pression plus faible sur le sol.</p>`,
q:[{q:"12 000 N sur 3 m² : pression ?",o:["4 000 Pa","36 000 Pa","400 Pa"],a:0,e:"12 000 / 3 = 4 000 Pa."},
{q:"Si on double la surface d'appui, la pression…",o:["double","est divisée par 2","ne change pas"],a:1,e:"P = F / S : S double, P est divisée par 2."},
{q:"1 pascal est égal à…",o:["1 N/m²","1 N·m","1 kg/m"],a:0,e:"Pa = N/m²."}]},
{t:"Moment d'une force",niv:"L1",body:`
<p>Le <b>moment</b> d'une force mesure sa capacité à faire tourner un objet : <b>M = F × d</b>, en N·m. Ici d est le <b>bras de levier</b>, la distance perpendiculaire entre l'axe de rotation et la ligne d'action de la force.</p>
<p><b>Exemple :</b> une force de 200 N à 3 m de l'axe donne M = 600 N·m.</p>
<p><b>Équilibre :</b> la somme des moments est nulle. Balançoire : 300 N à 2 m (600 N·m) est équilibré par une force F à 3 m telle que F × 3 = 600, donc F = 200 N.</p>`,
q:[{q:"Moment d'une force de 200 N à 3 m de l'axe ?",o:["600 N·m","67 N·m","203 N·m"],a:0,e:"M = 200 × 3 = 600 N·m."},
{q:"Pour faire tourner plus facilement une porte, on pousse…",o:["près des gonds","loin des gonds","au milieu"],a:1,e:"Un bras de levier plus grand donne un moment plus grand."},
{q:"Balançoire : 300 N à 2 m. Quelle force à 3 m pour équilibrer ?",o:["200 N","450 N","100 N"],a:0,e:"300 × 2 = F × 3, donc F = 200 N."}]},
{t:"Chaleur et isolation thermique",niv:"L1",body:`
<p>La chaleur se transmet de trois façons :</p>
<ul><li><b>Conduction</b> : à travers un matériau solide (un mur).</li>
<li><b>Convection</b> : par le mouvement d'un fluide (l'air chaud monte).</li>
<li><b>Rayonnement</b> : sans contact (le soleil chauffe la terre).</li></ul>
<p>Un bon isolant a une <b>conductivité thermique λ faible</b> (en W/(m·K)). Ordre de grandeur : béton ≈ 1,5, laine minérale ≈ 0,04.</p>`,
q:[{q:"La chaleur qui traverse un mur solide se transmet par…",o:["conduction","convection","rayonnement"],a:0,e:"Dans un solide, c'est la conduction."},
{q:"Un bon isolant thermique a une conductivité λ…",o:["faible","élevée","nulle toujours"],a:0,e:"Plus λ est petite, moins le matériau laisse passer la chaleur."},
{q:"La chaleur du soleil nous parvient par…",o:["rayonnement","conduction","convection"],a:0,e:"Le rayonnement traverse le vide spatial."}]}
]},
{id:"materiaux",nom:"Matériaux de construction",ico:"🧱",desc:"Béton armé, bois, acier, briques, terre",lessons:[
{t:"Béton et béton armé",niv:"Prépa",body:`
<p>Le béton résiste très bien à la <b>compression</b> (écrasement) mais mal à la <b>traction</b> (étirement). L'acier résiste très bien à la traction.</p>
<p>Le <b>béton armé</b> combine les deux : on place des barres d'acier là où la pièce est tendue (par exemple en bas d'une poutre qui fléchit).</p>
<p>Sans armatures, une poutre en béton se fissure et casse dès que la partie basse est tendue.</p>`,
q:[{q:"Le béton seul résiste mal à…",o:["la compression","la traction","la chaleur modérée"],a:1,e:"Sa résistance à la traction est faible."},
{q:"Pourquoi ajoute-t-on de l'acier dans le béton ?",o:["Pour résister à la traction","Pour le colorer","Pour le rendre plus léger"],a:0,e:"L'acier reprend les efforts de traction."},
{q:"Dans une poutre qui fléchit, les armatures principales se placent…",o:["en bas, côté tendu","au centre seulement","sur le dessus uniquement"],a:0,e:"La face inférieure est tendue pour une poutre posée sur deux appuis."}]},
{t:"Le bois et l'acier",niv:"Prépa",body:`
<p><b>Bois :</b> matériau renouvelable et léger, bon rapport résistance / poids. Il craint l'humidité prolongée, les insectes (termites) et le feu s'il n'est pas traité.</p>
<p><b>Acier :</b> très résistant, permet de grandes portées et la préfabrication. Il rouille s'il n'est pas protégé et perd fortement sa résistance à haute température, donc il faut le protéger contre l'incendie.</p>`,
q:[{q:"Un point faible du bois est…",o:["l'humidité prolongée","la résistance à la traction","le poids"],a:0,e:"L'humidité favorise la pourriture et les insectes."},
{q:"L'acier non protégé risque de…",o:["rouiller","pourrir","fondre à température ambiante"],a:0,e:"Il s'oxyde avec l'eau et l'oxygène."},
{q:"À haute température (incendie), l'acier…",o:["perd beaucoup de résistance","devient plus solide","ne change pas"],a:0,e:"Sa résistance chute fortement à haute température."}]},
{t:"Briques, blocs, pierre et terre",niv:"Prépa",body:`
<ul><li><b>Brique cuite</b> : argile moulée puis cuite au four.</li>
<li><b>Parpaing</b> : bloc creux en béton.</li>
<li><b>Pierre naturelle</b> : résistante et durable, mais lourde et plus chère à tailler et à transporter.</li>
<li><b>Terre crue</b> (adobe, briques de terre) : fabriquée à partir de terre séchée, avec un faible coût énergétique. Elle régule bien l'humidité et la chaleur, mais craint l'eau et demande une bonne protection (toiture débordante, soubassement).</li></ul>`,
q:[{q:"Une brique cuite est fabriquée à partir…",o:["d'argile cuite","de sable seul","de ciment cuit"],a:0,e:"L'argile moulée est cuite au four."},
{q:"Un parpaing est…",o:["un bloc de béton","une brique en bois","une pierre taillée"],a:0,e:"C'est un bloc, généralement creux, en béton."},
{q:"Le principal danger pour la terre crue est…",o:["l'eau","le soleil","le vent léger"],a:0,e:"La terre crue s'érode et s'affaiblit au contact prolongé de l'eau."}]}
]},
{id:"histoire",nom:"Histoire de l'architecture",ico:"🏛️",desc:"De l'Antiquité à l'architecture moderne",lessons:[
{t:"Égypte et Grèce antique",niv:"Prépa",body:`
<p><b>Égypte :</b> pyramides de Gizeh (vers 2500 av. J.-C.), temples en pierre aux murs épais et aux colonnes massives.</p>
<p><b>Grèce :</b> le <b>Parthénon</b> (Athènes, 5ᵉ siècle av. J.-C.) est le temple le plus célèbre. Les Grecs ont codifié trois <b>ordres</b> de colonnes :</p>
<ul><li><b>Dorique</b> : sobre, chapiteau simple</li><li><b>Ionique</b> : chapiteau à volutes</li><li><b>Corinthien</b> : chapiteau décoré de feuilles d'acanthe</li></ul>`,
q:[{q:"Où se trouve le Parthénon ?",o:["Athènes","Rome","Le Caire"],a:0,e:"Il couronne l'Acropole d'Athènes."},
{q:"Quel ordre grec a un chapiteau à feuilles d'acanthe ?",o:["Dorique","Ionique","Corinthien"],a:2,e:"Le corinthien est le plus décoré."},
{q:"L'ordre le plus sobre est…",o:["dorique","ionique","corinthien"],a:0,e:"Le dorique a un chapiteau simple."}]},
{t:"L'architecture romaine",niv:"Prépa",body:`
<p>Les Romains utilisent l'<b>arc en plein cintre</b> (demi-circulaire), la <b>voûte</b>, la <b>coupole</b> et un béton très résistant. Cela leur permet de couvrir de grands espaces.</p>
<ul><li><b>Panthéon</b> (Rome, vers 125 apr. J.-C.) : grande coupole en béton.</li>
<li><b>Colisée</b> : amphithéâtre pour les spectacles.</li>
<li><b>Aqueducs</b> : ponts à arcades qui transportent l'eau.</li></ul>`,
q:[{q:"Quelle forme d'arc caractérise l'architecture romaine ?",o:["Plein cintre","Brisé","En fer à cheval seulement"],a:0,e:"Arc en demi-cercle."},
{q:"Le Panthéon de Rome est célèbre pour sa…",o:["coupole","flèche","tour penchée"],a:0,e:"Sa coupole en béton est une prouesse technique."},
{q:"Un aqueduc sert à…",o:["transporter l'eau","faire des spectacles","défendre une ville"],a:0,e:"Il conduit l'eau, souvent sur des arcades."}]},
{t:"Gothique et Renaissance",niv:"L1",body:`
<p><b>Gothique</b> (12ᵉ au 15ᵉ siècle) : <b>arc brisé</b>, <b>voûte sur croisée d'ogives</b>, <b>arcs-boutants</b> qui reprennent la poussée des voûtes, grandes verrières et vitraux. Exemple : Notre-Dame de Paris.</p>
<p><b>Renaissance</b> (à partir du 15ᵉ siècle, en Italie) : retour aux modèles antiques, symétrie et proportions. Brunelleschi réalise la coupole de la cathédrale de Florence, achevée en 1436.</p>`,
q:[{q:"Quel type d'arc est typique du gothique ?",o:["Arc brisé","Plein cintre","Arc plat"],a:0,e:"L'arc brisé est pointu."},
{q:"Les arcs-boutants servent à…",o:["reprendre la poussée des voûtes","décorer les façades","éclairer la nef"],a:0,e:"Ils contrebutent les murs extérieurs."},
{q:"Qui a construit la coupole de la cathédrale de Florence ?",o:["Brunelleschi","Le Corbusier","Gropius"],a:0,e:"Filippo Brunelleschi, achevée en 1436."}]},
{t:"L'architecture moderne",niv:"L1",body:`
<p>Le <b>Bauhaus</b>, école fondée en 1919 en Allemagne par Walter Gropius, associe art, artisanat et industrie.</p>
<p><b>Le Corbusier</b> résume l'architecture moderne en cinq points : <b>pilotis</b>, <b>toit-terrasse</b>, <b>plan libre</b>, <b>façade libre</b> et <b>fenêtre en bandeau</b>. La villa Savoye (Poissy, 1931) les applique.</p>
<p>Mies van der Rohe est associé à la formule « Less is more » (moins, c'est plus).</p>`,
q:[{q:"Qui a fondé le Bauhaus en 1919 ?",o:["Walter Gropius","Le Corbusier","Brunelleschi"],a:0,e:"Walter Gropius, à Weimar."},
{q:"Les pilotis font partie…",o:["des cinq points de Le Corbusier","des ordres grecs","de l'art gothique"],a:0,e:"Ils soulèvent le bâtiment et libèrent le sol."},
{q:"La villa Savoye est une œuvre de…",o:["Le Corbusier","Gropius","Mies van der Rohe"],a:0,e:"Elle a été construite à Poissy en 1931."}]}
]}
);

DATA[0].lessons.push(
{t:"Structure électronique et valence",niv:"Prépa",body:`
<p>Les électrons occupent des couches : <b>K</b> (2 électrons au maximum), <b>L</b> (8 au maximum), <b>M</b> (8 au maximum pour les éléments jusqu'à Z = 18).</p>
<p><b>Exemples :</b> Na (Z = 11) : K2 L8 M1, donc 1 électron de valence. Cl (Z = 17) : K2 L8 M7, donc 7 électrons de valence.</p>
<p>Les électrons de la dernière couche sont les <b>électrons de valence</b>. Les gaz nobles (He, Ne, Ar) ont une dernière couche pleine : ils sont très stables. Les autres atomes cherchent à atteindre cette stabilité (règle de l'octet).</p>`,
q:[{q:"Combien d'électrons de valence pour Na (Z = 11) ?",o:["1","8","11"],a:0,e:"Répartition K2 L8 M1 : 1 électron sur la dernière couche."},
{q:"Combien d'électrons de valence pour Cl (Z = 17) ?",o:["1","7","17"],a:1,e:"Répartition K2 L8 M7."},
{q:"Pourquoi les gaz nobles sont-ils stables ?",o:["Leur dernière couche est pleine","Ils sont lourds","Ils n'ont pas d'électrons"],a:0,e:"Une couche externe pleine donne une grande stabilité."}]},
{t:"Solutions et concentration",niv:"Prépa",body:`
<ul><li><b>Concentration molaire</b> : C = n / V (mol/L)</li>
<li><b>Concentration massique</b> : Cm = m / V (g/L)</li>
<li><b>Dilution</b> : C₁ × V₁ = C₂ × V₂ (la quantité de matière ne change pas)</li></ul>
<p><b>Exemple :</b> 0,5 mol dissoute dans 2 L donne C = 0,25 mol/L.</p>
<p><b>Dilution :</b> on prend 100 mL d'une solution à 1 mol/L et on complète à 500 mL. C₂ = 1 × 100 / 500 = 0,2 mol/L.</p>`,
q:[{q:"0,5 mol dans 2 L : concentration ?",o:["0,25 mol/L","1 mol/L","4 mol/L"],a:0,e:"C = 0,5 / 2 = 0,25 mol/L."},
{q:"100 mL à 1 mol/L complétés à 500 mL : nouvelle concentration ?",o:["0,2 mol/L","5 mol/L","0,5 mol/L"],a:0,e:"C₂ = 1 × 100 / 500 = 0,2 mol/L."},
{q:"Cm = m / V s'exprime en…",o:["g/L","mol/L","N/m²"],a:0,e:"Masse en grammes divisée par volume en litres."}]},
{t:"Oxydoréduction et corrosion",niv:"L1",body:`
<ul><li><b>Oxydation</b> : perte d'électrons. Exemple : Fe → Fe²⁺ + 2 e⁻</li>
<li><b>Réduction</b> : gain d'électrons.</li></ul>
<p>La corrosion de l'acier est une oxydation du fer. Pour s'en protéger :</p>
<ul><li><b>Peinture</b> : isole le métal de l'air et de l'eau</li>
<li><b>Galvanisation</b> : couche de zinc. Le zinc s'oxyde à la place du fer.</li>
<li><b>Acier inoxydable</b> : contient du chrome, qui forme une fine couche protectrice</li></ul>`,
q:[{q:"L'oxydation est…",o:["une perte d'électrons","un gain d'électrons","un changement d'état"],a:0,e:"Oxydation = perte d'électrons."},
{q:"La galvanisation consiste à…",o:["recouvrir l'acier de zinc","peindre l'acier en blanc","chauffer l'acier"],a:0,e:"Le zinc protège le fer en s'oxydant en premier."},
{q:"Fe → Fe²⁺ + 2 e⁻ est une…",o:["oxydation","réduction","dilution"],a:0,e:"Le fer perd deux électrons."}]},
{t:"La chaux et le plâtre",niv:"L1",body:`
<p><b>Cycle de la chaux :</b></p>
<ul><li>Cuisson du calcaire vers 900 °C : CaCO₃ → CaO + CO₂ (chaux vive)</li>
<li>Extinction avec de l'eau : CaO + H₂O → Ca(OH)₂ (chaux éteinte), réaction qui dégage beaucoup de chaleur</li>
<li>Durcissement à l'air : Ca(OH)₂ + CO₂ → CaCO₃ + H₂O (carbonatation)</li></ul>
<p><b>Plâtre :</b> le gypse (CaSO₄·2H₂O) est chauffé vers 150 °C, il perd une partie de son eau. Mélangé à l'eau, il durcit en reprenant cette eau.</p>`,
q:[{q:"La chaux vive est…",o:["CaO","Ca(OH)₂","CaCO₃"],a:0,e:"CaO s'obtient par cuisson du calcaire."},
{q:"L'extinction de la chaux vive avec de l'eau…",o:["dégage de la chaleur","refroidit le mélange","ne produit rien"],a:0,e:"La réaction est fortement exothermique."},
{q:"Le plâtre est fabriqué à partir de…",o:["gypse","argile","sable"],a:0,e:"On chauffe le gypse vers 150 °C."}]},
{t:"Le verre",niv:"L1",body:`
<p>Le verre courant est fabriqué à partir de <b>sable</b> (silice SiO₂), de <b>soude</b> (carbonate de sodium) et de <b>calcaire</b>, fondus vers 1 500 °C.</p>
<ul><li>Le verre est <b>amorphe</b> : ses atomes ne sont pas rangés en cristal.</li>
<li><b>Verre trempé</b> : refroidi brusquement, plus résistant, il se brise en petits morceaux.</li>
<li><b>Verre feuilleté</b> : plusieurs verres collés avec un film plastique, les morceaux restent en place s'il casse.</li></ul>`,
q:[{q:"Quelle matière première principale pour le verre ?",o:["Le sable (silice)","Le fer","Le bois"],a:0,e:"La silice SiO₂ est le constituant principal."},
{q:"Le verre est un solide…",o:["amorphe","cristallin parfait","liquide"],a:0,e:"Ses atomes n'ont pas d'arrangement en cristal."},
{q:"Quel verre garde les morceaux en place quand il casse ?",o:["Le verre feuilleté","Le verre trempé","Aucun"],a:0,e:"Le film plastique intercalaire retient les fragments."}]},
{t:"Polymères et matières plastiques",niv:"L1",body:`
<p>Un <b>polymère</b> est formé de très longues chaînes de petites molécules répétées (les monomères).</p>
<ul><li><b>PVC</b> : tuyaux, menuiseries</li><li><b>Polyéthylène (PE)</b> : tuyaux, films</li><li><b>Polystyrène expansé</b> : isolant thermique</li></ul>
<p><b>Thermoplastiques</b> : ramollissent quand on les chauffe et peuvent être remodelés. <b>Thermodurcissables</b> (résines époxy par exemple) : durcissent de façon définitive.</p>`,
q:[{q:"Un thermoplastique…",o:["ramollit à la chaleur","durcit définitivement à la chaleur","est toujours liquide"],a:0,e:"On peut le chauffer et le remodeler."},
{q:"Le polystyrène expansé sert surtout à…",o:["isoler","supporter les charges","conduire l'électricité"],a:0,e:"C'est un isolant thermique."},
{q:"Un polymère est formé de…",o:["longues chaînes de monomères","un seul atome","cristaux de sel"],a:0,e:"Les monomères se répètent pour former la chaîne."}]}
);

DATA[1].lessons.push(
{t:"Conventions de dessin et cotation",niv:"Prépa",body:`
<ul><li><b>Trait continu fort</b> : contours et arêtes visibles</li>
<li><b>Trait interrompu fin (tirets)</b> : contours et arêtes cachés</li>
<li><b>Trait mixte fin (point-tiret)</b> : axes de symétrie et axes de révolution</li>
<li><b>Trait continu fin</b> : lignes de cote, lignes d'attache, hachures</li></ul>
<p>Une cote indique une dimension réelle (pas celle mesurée sur le dessin). L'unité (mm, cm ou m) est précisée sur le dessin.</p>`,
q:[{q:"Les arêtes cachées se dessinent en…",o:["tirets fins","trait continu fort","point-tiret"],a:0,e:"Trait interrompu fin pour ce qui est caché."},
{q:"Un axe de symétrie se dessine en…",o:["trait mixte fin (point-tiret)","trait continu fort","tirets épais"],a:0,e:"Le trait mixte fin sert pour les axes."},
{q:"Une cote indique…",o:["la dimension réelle","la mesure au double décimètre sur la feuille","la couleur"],a:0,e:"La cote donne la valeur réelle, indépendante de l'échelle."}]},
{t:"Tracés géométriques de base",niv:"Prépa",body:`
<ul><li><b>Médiatrice d'un segment AB</b> : avec un compas ouvert à plus de la moitié de AB, trace des arcs depuis A puis depuis B. Joins leurs deux points d'intersection : la droite obtenue passe par le milieu de AB et lui est perpendiculaire.</li>
<li><b>Bissectrice d'un angle</b> : droite qui le partage en deux angles égaux.</li>
<li><b>Division d'un segment en n parties égales</b> : on trace une demi-droite auxiliaire graduée en n parties égales, puis on joint l'extrémité au segment et on trace des parallèles (théorème de Thalès).</li></ul>`,
q:[{q:"La médiatrice de AB passe par…",o:["le milieu de AB et lui est perpendiculaire","A seulement","B seulement"],a:0,e:"C'est l'ensemble des points à égale distance de A et de B."},
{q:"La bissectrice d'un angle…",o:["le partage en deux angles égaux","est perpendiculaire à un côté","est toujours horizontale"],a:0,e:"Elle coupe l'angle en deux parties égales."},
{q:"Pour diviser un segment en 5 parties égales, on utilise…",o:["le théorème de Thalès","le théorème de Pythagore","la trigonométrie"],a:0,e:"On trace des parallèles à partir d'une demi-droite auxiliaire graduée."}]},
{t:"Le plan de profil",niv:"L1",body:`
<p>Le <b>plan de profil</b> est perpendiculaire à H et à V, donc perpendiculaire à LT. On l'utilise pour obtenir une troisième projection, la <b>vue de profil</b> (vue de gauche ou de droite).</p>
<p>Sur la vue de profil, on lit à la fois la <b>cote</b> (comme sur V) et l'<b>éloignement</b> (comme sur H).</p>
<p>Une <b>droite de profil</b> (contenue dans un plan de profil) a ses projections horizontale et verticale toutes les deux perpendiculaires à LT.</p>`,
q:[{q:"Le plan de profil est…",o:["perpendiculaire à LT","parallèle à LT","parallèle à H"],a:0,e:"Il est perpendiculaire à H et à V, donc à LT."},
{q:"Une droite de profil a ses projections…",o:["perpendiculaires à LT","parallèles à LT","réduites à un point"],a:0,e:"Les deux projections sont portées par des perpendiculaires à LT."},
{q:"La vue de profil montre…",o:["la cote et l'éloignement","la cote seulement","aucune dimension"],a:0,e:"On y lit les deux dimensions de position."}]},
{t:"Vraie grandeur d'un segment",niv:"L1",body:`
<p>Un segment quelconque se projette plus court que sa longueur réelle. On retrouve sa <b>vraie grandeur</b> par un triangle rectangle :</p>
<ul><li>un côté = la projection horizontale ab</li><li>l'autre côté = la différence de cotes (hauteur entre les deux extrémités)</li><li>l'hypoténuse = vraie grandeur du segment</li></ul>
<p><b>Exemple :</b> ab = 4 m et différence de cotes = 3 m, donc VG = √(4² + 3²) = 5 m.</p>`,
q:[{q:"ab = 4 m, différence de cotes = 3 m. Vraie grandeur ?",o:["5 m","7 m","1 m"],a:0,e:"√(16 + 9) = 5 m."},
{q:"ab = 6 m, différence de cotes = 8 m. Vraie grandeur ?",o:["10 m","14 m","2 m"],a:0,e:"√(36 + 64) = 10 m."},
{q:"La vraie grandeur est toujours…",o:["supérieure ou égale à la projection","inférieure à la projection","égale à la cote"],a:0,e:"Une projection orthogonale ne peut que raccourcir ou conserver la longueur."}]},
{t:"Changement de plan de projection",niv:"L1",body:`
<p>On remplace un plan de projection par un nouveau plan perpendiculaire à l'autre. On trace une nouvelle ligne de terre LT₁.</p>
<p>Si on remplace V par V₁ (perpendiculaire à H) : la nouvelle projection a₁′ est sur la perpendiculaire à LT₁ passant par a, à une distance de LT₁ égale à la <b>cote</b> de A (la cote ne change pas, car H reste le même).</p>
<p><b>But :</b> choisir LT₁ parallèle à la projection ab d'une droite. La droite devient alors parallèle à V₁ et sa projection a₁′b₁′ est en <b>vraie grandeur</b>.</p>`,
q:[{q:"Quand on change le plan vertical, la cote d'un point…",o:["ne change pas","devient nulle","double"],a:0,e:"La cote est la distance à H, qui reste inchangé."},
{q:"Pour obtenir la vraie grandeur de ab, on choisit LT₁…",o:["parallèle à ab","perpendiculaire à ab","à 45° de ab"],a:0,e:"La droite devient alors parallèle au nouveau plan."},
{q:"Le nouveau plan de projection doit être…",o:["perpendiculaire à l'autre plan","parallèle à l'autre plan","oblique"],a:0,e:"Le système de projection reste orthogonal."}]},
{t:"Sections planes de solides",niv:"L1",body:`
<ul><li><b>Prisme droit</b>, plan parallèle aux bases : polygone identique à la base.</li>
<li><b>Cylindre</b> : plan perpendiculaire à l'axe → cercle ; plan parallèle à l'axe → rectangle ; plan oblique → ellipse.</li>
<li><b>Cône</b> : plan perpendiculaire à l'axe → cercle ; plan passant par l'axe → triangle ; plan oblique qui coupe toutes les génératrices → ellipse ; plan parallèle à une génératrice → parabole ; plan parallèle à l'axe → hyperbole.</li></ul>`,
q:[{q:"Section d'un cylindre par un plan perpendiculaire à l'axe ?",o:["un cercle","un rectangle","une ellipse allongée seulement"],a:0,e:"Le plan est parallèle aux bases : on obtient un cercle."},
{q:"Section d'un cône par un plan passant par l'axe ?",o:["un triangle","un cercle","une parabole"],a:0,e:"On obtient un triangle isocèle."},
{q:"Section d'un cône par un plan parallèle à une génératrice ?",o:["une parabole","une ellipse","un cercle"],a:0,e:"C'est le cas limite entre ellipse et hyperbole."}]},
{t:"Développement des solides",niv:"L1",body:`
<p>Développer un solide, c'est mettre sa surface à plat sans la déformer.</p>
<ul><li><b>Prisme droit</b> : rectangles côte à côte, plus les deux bases.</li>
<li><b>Cylindre</b> (rayon r, hauteur h) : un rectangle de hauteur h et de largeur 2πr, plus deux disques.</li>
<li><b>Cône</b> : un secteur circulaire de rayon g (génératrice), dont l'arc mesure 2πr. Angle du secteur = 360° × r / g.</li>
<li><b>Pyramide</b> : des triangles autour de la base.</li>
<li>La <b>sphère</b> n'est pas développable.</li></ul>
<p><b>Exemple :</b> cône de rayon 3 m et de génératrice 5 m : angle = 360 × 3 / 5 = 216°.</p>`,
q:[{q:"Le développement d'un cylindre est…",o:["un rectangle et deux disques","un secteur circulaire","un triangle"],a:0,e:"La surface latérale se déroule en rectangle."},
{q:"Cône : r = 3 m, g = 5 m. Angle du secteur développé ?",o:["216°","108°","180°"],a:0,e:"360 × 3 / 5 = 216°."},
{q:"Quel solide ne peut pas être développé ?",o:["La sphère","Le cône","Le prisme"],a:0,e:"La surface d'une sphère ne peut pas être mise à plat sans déformation."}]}
);

{t:"Angles et droites",niv:"Prépa",body:`
<ul><li><b>Aigu</b> : moins de 90° &nbsp;|&nbsp; <b>droit</b> : 90° &nbsp;|&nbsp; <b>obtus</b> : entre 90° et 180° &nbsp;|&nbsp; <b>plat</b> : 180°</li>
<li>Deux angles sont <b>complémentaires</b> si leur somme vaut 90°, et <b>supplémentaires</b> si elle vaut 180°.</li>
<li>Les angles <b>opposés par le sommet</b> sont égaux.</li>
<li>Deux droites parallèles coupées par une sécante forment des angles <b>correspondants égaux</b> et des angles <b>alternes-internes égaux</b>.</li></ul>
<p><b>Exemple :</b> le complémentaire d'un angle de 35° est 55°.</p>`,
q:[{q:"Quel est le complémentaire de 35° ?",o:["55°","145°","65°"],a:0,e:"90 − 35 = 55°."},
{q:"Quel est le supplémentaire de 110° ?",o:["70°","80°","250°"],a:0,e:"180 − 110 = 70°."},
{q:"Deux droites parallèles coupées par une sécante : les angles alternes-internes sont…",o:["égaux","supplémentaires","complémentaires"],a:0,e:"Les alternes-internes sont égaux quand les droites sont parallèles."}]},
{t:"Les triangles",niv:"Prépa",body:`
<ul><li>La somme des angles d'un triangle vaut <b>180°</b>.</li>
<li><b>Équilatéral</b> : trois côtés égaux et trois angles de 60°. <b>Isocèle</b> : deux côtés égaux, deux angles égaux à la base. <b>Rectangle</b> : un angle droit.</li>
<li><b>Inégalité triangulaire</b> : chaque côté est plus petit que la somme des deux autres.</li>
<li>Droites remarquables : <b>hauteur</b>, <b>médiane</b> (vers le milieu du côté opposé), <b>médiatrice</b>, <b>bissectrice</b>.</li>
<li>Aire = base × hauteur / 2.</li></ul>`,
q:[{q:"Un triangle a des angles de 50° et 60°. Le troisième vaut…",o:["70°","110°","80°"],a:0,e:"180 − 50 − 60 = 70°."},
{q:"Un triangle isocèle a un angle au sommet de 40°. Chaque angle à la base vaut…",o:["70°","40°","140°"],a:0,e:"(180 − 40) / 2 = 70°."},
{q:"Peut-on construire un triangle de côtés 2, 3 et 7 ?",o:["Non","Oui","Seulement s'il est rectangle"],a:0,e:"2 + 3 = 5 est plus petit que 7 : l'inégalité triangulaire n'est pas respectée."}]},
{t:"Quadrilatères et polygones",niv:"Prépa",body:`
<ul><li><b>Carré</b>, <b>rectangle</b>, <b>losange</b>, <b>parallélogramme</b>, <b>trapèze</b> (deux côtés parallèles).</li>
<li>Aire du parallélogramme : base × hauteur. Aire du losange : D × d / 2. Aire du trapèze : (B + b) × h / 2.</li>
<li>Somme des angles d'un polygone convexe à n côtés : <b>(n − 2) × 180°</b>.</li>
<li>Polygone régulier : tous les côtés et tous les angles sont égaux. Angle intérieur = (n − 2) × 180° / n.</li></ul>
<p><b>Exemple :</b> hexagone régulier : somme = 4 × 180 = 720°, chaque angle = 120°.</p>`,
q:[{q:"Somme des angles d'un quadrilatère ?",o:["360°","180°","540°"],a:0,e:"(4 − 2) × 180 = 360°."},
{q:"Trapèze : B = 8 m, b = 4 m, h = 3 m. Aire ?",o:["18 m²","12 m²","36 m²"],a:0,e:"(8 + 4) × 3 / 2 = 18 m²."},
{q:"Angle intérieur d'un hexagone régulier ?",o:["120°","108°","135°"],a:0,e:"(6 − 2) × 180 / 6 = 120°."}]},
{t:"Le cercle",niv:"Prépa",body:`
<ul><li>Éléments : <b>rayon</b>, <b>diamètre</b>, <b>corde</b>, <b>arc</b>, <b>secteur</b>, <b>tangente</b>.</li>
<li>La tangente est <b>perpendiculaire au rayon</b> au point de contact.</li>
<li>Aire : π r². Longueur d'un arc d'angle α : (α / 360) × 2 π r.</li>
<li>Un <b>angle inscrit</b> vaut la moitié de l'angle au centre qui intercepte le même arc.</li>
<li>Un triangle inscrit dans un cercle dont un côté est un diamètre est <b>rectangle</b>.</li></ul>
<p><b>Exemple :</b> arc de 90° sur un cercle de rayon 4 m : (90 / 360) × 2π × 4 = 2π ≈ 6,28 m (une arche en quart de cercle).</p>`,
q:[{q:"La tangente à un cercle est… au rayon au point de contact.",o:["perpendiculaire","parallèle","à 45°"],a:0,e:"Rayon et tangente forment un angle droit."},

{q:"Un triangle inscrit avec un côté égal au diamètre est…",o:["rectangle","équilatéral","isocèle obligatoirement"],a:0,e:"Il est rectangle en le sommet opposé au diamètre."}]},
{t:"Triangle rectangle : Pythagore et trigonométrie",niv:"Prépa",body:`
<ul><li><b>Pythagore</b> : a² + b² = c² (c est l'hypoténuse). La <b>réciproque</b> permet de vérifier qu'un triangle est rectangle.</li>
<li><b>sin α</b> = opposé / hypoténuse &nbsp;|&nbsp; <b>cos α</b> = adjacent / hypoténuse &nbsp;|&nbsp; <b>tan α</b> = opposé / adjacent</li>
<li>Valeurs utiles : sin 30° = 0,5 ; cos 60° = 0,5 ; sin 45° = cos 45° ≈ 0,707.</li></ul>
<p><b>Sur chantier :</b> la règle du triangle 3-4-5 sert à tracer un angle droit au sol.</p>
<p><b>Exemple :</b> hypoténuse de 10 m et angle de 30° : le côté opposé mesure 10 × sin 30° = 5 m.</p>`,
q:[{q:"Un triangle de côtés 5, 12 et 13 est-il rectangle ?",o:["Oui","Non","Impossible à savoir"],a:0,e:"5² + 12² = 25 + 144 = 169 = 13²."},
{q:"Hypoténuse 10 m, angle 30° : côté opposé ?",o:["5 m","8,66 m","20 m"],a:0,e:"10 × sin 30° = 5 m."},
{q:"cos 60° vaut…",o:["0,5","0,866","1"],a:0,e:"cos 60° = 0,5."}]},
{t:"Symétries, translations, rotations, homothétie",niv:"Prépa",body:`
<ul><li><b>Symétrie axiale</b> : image dans un miroir. Elle conserve les distances et les angles.</li>
<li><b>Symétrie centrale</b> : demi-tour autour d'un point.</li>
<li><b>Translation</b> : glissement selon un vecteur.</li>
<li><b>Rotation</b> : tour autour d'un centre selon un angle.</li>
<li><b>Homothétie</b> de rapport k : les longueurs sont multipliées par |k|, les aires par k², les volumes par k³.</li></ul>
<p><b>Application :</b> une maquette au 1/100 réduit les longueurs par 100, les aires par 10 000 et les volumes par 1 000 000.</p>`,
q:[{q:"Une homothétie de rapport 3 multiplie les aires par…",o:["9","3","6"],a:0,e:"Les aires sont multipliées par k² = 9."},
{q:"Maquette au 1/100 : les volumes sont divisés par…",o:["1 000 000","100","10 000"],a:0,e:"100³ = 1 000 000."},
{q:"La symétrie axiale conserve…",o:["les distances et les angles","seulement les angles","rien"],a:0,e:"C'est une isométrie : elle conserve les longueurs et les angles."}]},
{t:"Repère, vecteurs et droites",niv:"L1",body:`
<ul><li><b>Distance</b> entre A(x<sub>A</sub>, y<sub>A</sub>) et B(x<sub>B</sub>, y<sub>B</sub>) : AB = √((x<sub>B</sub> − x<sub>A</sub>)² + (y<sub>B</sub> − y<sub>A</sub>)²)</li>
<li><b>Milieu</b> de [AB] : ((x<sub>A</sub> + x<sub>B</sub>) / 2 ; (y<sub>A</sub> + y<sub>B</sub>) / 2)</li>
<li><b>Vecteur</b> AB : (x<sub>B</sub> − x<sub>A</sub> ; y<sub>B</sub> − y<sub>A</sub>)</li>
<li><b>Droite</b> : y = m x + p (m = pente). Deux droites sont parallèles si elles ont la même pente, et perpendiculaires si m × m′ = −1.</li></ul>
<p><b>Exemple :</b> A(1 ; 2) et B(4 ; 6). AB = √(3² + 4²) = 5, milieu = (2,5 ; 4), vecteur AB = (3 ; 4).</p>`,
q:[{q:"A(1 ; 2) et B(4 ; 6) : distance AB ?",o:["5","7","25"],a:0,e:"√(3² + 4²) = 5."},
{q:"Milieu de A(0 ; 0) et B(6 ; 4) ?",o:["(3 ; 2)","(6 ; 4)","(2 ; 3)"],a:0,e:"(0 + 6) / 2 = 3 et (0 + 4) / 2 = 2."},
{q:"Une droite de pente 2 : une droite perpendiculaire a pour pente…",o:["−0,5","0,5","−2"],a:0,e:"2 × (−0,5) = −1."}]},
{t:"Géométrie dans l'espace",niv:"L1",body:`
<ul><li>Deux plans sont <b>parallèles</b> ou <b>sécants</b> (leur intersection est une droite).</li>
<li>Une droite est <b>perpendiculaire à un plan</b> si elle est perpendiculaire à deux droites sécantes de ce plan (un poteau vertical sur un sol horizontal).</li>
<li><b>Sphère</b> : volume 4/3 π r³ et aire 4 π r².</li>
<li><b>Cube</b> d'arête a : volume a³, diagonale a√3.</li>
<li><b>Relation d'Euler</b> (polyèdre convexe) : sommets − arêtes + faces = 2.</li></ul>
<p><b>Exemple :</b> cube : 8 − 12 + 6 = 2. Sphère de rayon 3 m : volume = 4/3 × π × 27 = 36π ≈ 113,1 m³.</p>`,
q:[{q:"Cube d'arête 2 m : diagonale ?",o:["≈ 3,46 m","≈ 2,83 m","4 m"],a:0,e:"2√3 ≈ 3,46 m."},
{q:"Volume d'une sphère de rayon 3 m ?",o:["≈ 113,1 m³","≈ 28,3 m³","≈ 84,8 m³"],a:0,e:"4/3 × π × 27 = 36π ≈ 113,1 m³."},
{q:"Pour un cube : sommets − arêtes + faces = ?",o:["2","0","6"],a:0,e:"8 − 12 + 6 = 2."}]}
]}
);

{t:"Le théorème de Pythagore",niv:"Prépa",svg:SVG_PYTH,body:`
<p>Dans un <b>triangle rectangle</b>, le carré de l'<b>hypoténuse</b> (le côté opposé à l'angle droit, le plus long) est égal à la somme des carrés des deux autres côtés :</p>
<p style="text-align:center"><b>c² = a² + b²</b></p>
<ul><li>Pour trouver l'hypoténuse : c = √(a² + b²)</li>
<li>Pour trouver un côté de l'angle droit : a = √(c² − b²)</li></ul>
<p><b>Exemple 1 :</b> a = 6 et b = 8, donc c = √(36 + 64) = √100 = 10.</p>
<p><b>Exemple 2 :</b> c = 13 et b = 5, donc a = √(169 − 25) = √144 = 12.</p>
<p><b>À connaître :</b> la diagonale d'un rectangle L × l vaut √(L² + l²), et celle d'un carré de côté a vaut a√2.</p>`,
q:[{q:"Triangle rectangle de côtés 9 et 12 : hypoténuse ?",o:["15","21","108"],a:0,e:"√(81 + 144) = √225 = 15."},
{q:"Hypoténuse 17 et un côté 8 : l'autre côté vaut…",o:["15","9","25"],a:0,e:"√(289 − 64) = √225 = 15."},
{q:"Diagonale d'un carré de côté 5 m ?",o:["≈ 7,07 m","10 m","25 m"],a:0,e:"5√2 ≈ 7,07 m."}]},
{t:"Réciproque de Pythagore et équerre du maçon",niv:"Prépa",body:`
<p><b>Réciproque :</b> si, dans un triangle, le carré du plus grand côté est égal à la somme des carrés des deux autres, alors le triangle est <b>rectangle</b> (l'angle droit est en face du plus grand côté).</p>
<p>Si l'égalité est fausse, le triangle n'est <b>pas</b> rectangle.</p>
<p><b>Triplets pythagoriciens :</b> (3 ; 4 ; 5), (5 ; 12 ; 13), (8 ; 15 ; 17), (7 ; 24 ; 25), et leurs multiples comme (6 ; 8 ; 10).</p>
<p><b>Sur chantier :</b> avec une corde graduée 3-4-5 (ou 6-8-10), on trace un angle droit au sol. Pour vérifier qu'une fondation rectangulaire est bien d'équerre, on mesure ses deux diagonales : elles doivent être égales et valoir √(L² + l²).</p>`,
q:[{q:"Un triangle de côtés 4, 5 et 7 est-il rectangle ?",o:["Non","Oui","On ne peut pas savoir"],a:0,e:"4² + 5² = 41, mais 7² = 49 : l'égalité est fausse."},
{q:"Un triangle de côtés 6, 8 et 10 est-il rectangle ?",o:["Oui","Non","Seulement si on mesure les angles"],a:0,e:"36 + 64 = 100 = 10²."},
{q:"Fondation rectangulaire de 6 m sur 8 m : la diagonale doit mesurer…",o:["10 m","14 m","12 m"],a:0,e:"√(36 + 64) = 10 m."}]},
{t:"Pythagore en architecture",niv:"Prépa",body:`
<ul><li><b>Longueur d'un rampant de toit :</b> demi-portée 4 m et hauteur 1,5 m donnent √(16 + 2,25) = √18,25 ≈ 4,27 m.</li>
<li><b>Rampe d'accès :</b> 12 m en horizontal et 1 m de dénivelé donnent √(144 + 1) ≈ 12,04 m de rampe.</li>
<li><b>Dans l'espace :</b> la diagonale d'un parallélépipède de dimensions a, b, c vaut √(a² + b² + c²). Exemple : 3, 4 et 12 m donnent √169 = 13 m.</li></ul>
<p>Pour trouver une longueur inclinée (toit, rampe, escalier), on forme un triangle rectangle avec la longueur horizontale et la hauteur.</p>`,
q:[{q:"Demi-portée 3 m et hauteur 4 m : longueur du rampant ?",o:["5 m","7 m","12 m"],a:0,e:"√(9 + 16) = 5 m."},
{q:"Diagonale d'une pièce de 5 m sur 4 m ?",o:["≈ 6,40 m","9 m","20 m"],a:0,e:"√(25 + 16) = √41 ≈ 6,40 m."},
{q:"Diagonale d'un parallélépipède de 3 m, 4 m et 12 m ?",o:["13 m","19 m","12 m"],a:0,e:"√(9 + 16 + 144) = √169 = 13 m."}]},
{t:"Le théorème de Thalès",niv:"Prépa",svg:SVG_THALES,body:`
<p><b>Configuration :</b> un triangle ABC, un point M sur (AB), un point N sur (AC), avec (MN) <b>parallèle</b> à (BC). Alors :</p>
<p style="text-align:center"><b>AM / AB = AN / AC = MN / BC</b></p>
<p>Le résultat est le même en configuration « papillon » (M et N de l'autre côté du sommet A).</p>
<p><b>Calcul (produit en croix) :</b> AM = 3, AB = 5 et AN = 4,5. Alors AM / AB = 0,6, donc AC = 4,5 / 0,6 = 7,5. Si BC = 10, alors MN = 0,6 × 10 = 6.</p>
<p><b>Attention :</b> les rapports se font entre les longueurs prises depuis le sommet commun A (petit segment sur grand segment), et MN sur BC.</p>`,
q:[{q:"(MN) // (BC), AM = 3, AB = 5, BC = 10 : MN = ?",o:["6","4","7,5"],a:0,e:"MN = 10 × 3 / 5 = 6."},
{q:"(MN) // (BC), AM = 2, AB = 6, AN = 3 : AC = ?",o:["9","4","5"],a:0,e:"AC = AN × AB / AM = 3 × 6 / 2 = 9."},
{q:"On peut appliquer Thalès à condition que…",o:["(MN) et (BC) soient parallèles","le triangle soit rectangle","le triangle soit isocèle"],a:0,e:"Le parallélisme est la condition du théorème."}]},
{t:"Réciproque de Thalès",niv:"Prépa",body:`
<p>Si les points A, M, B sont alignés, A, N, C sont alignés <b>dans le même ordre</b>, et si <b>AM / AB = AN / AC</b>, alors les droites (MN) et (BC) sont <b>parallèles</b>.</p>
<p>Si les deux rapports sont différents, les droites ne sont <b>pas</b> parallèles.</p>
<p><b>Exemple 1 :</b> AM = 2, AB = 5, AN = 3, AC = 7,5. On a 2 / 5 = 0,4 et 3 / 7,5 = 0,4. Les rapports sont égaux : (MN) // (BC).</p>
<p><b>Exemple 2 :</b> AM = 2, AB = 5, AN = 3, AC = 8. On a 0,4 et 0,375. Les rapports sont différents : (MN) n'est pas parallèle à (BC).</p>`,
q:[{q:"AM = 2, AB = 5, AN = 3, AC = 7,5 : (MN) // (BC) ?",o:["Oui","Non","On ne peut pas savoir"],a:0,e:"2 / 5 = 0,4 = 3 / 7,5."},
{q:"AM = 4, AB = 6, AN = 5, AC = 9 : (MN) // (BC) ?",o:["Non","Oui","On ne peut pas savoir"],a:0,e:"4 / 6 ≈ 0,667 et 5 / 9 ≈ 0,556 : rapports différents."},
{q:"Pour utiliser la réciproque, on doit…",o:["comparer deux rapports de longueurs","mesurer un angle droit","calculer une aire"],a:0,e:"On compare AM / AB et AN / AC."}]},
{t:"Thalès en pratique",niv:"Prépa",body:`
<ul><li><b>Hauteur d'un arbre ou d'un bâtiment par son ombre :</b> un bâton de 1,5 m a une ombre de 2 m. L'arbre a une ombre de 12 m. Les rayons du soleil sont parallèles, donc hauteur = 1,5 / 2 × 12 = 9 m.</li>
<li><b>Diviser un segment en parties égales :</b> on trace une demi-droite auxiliaire graduée, puis des parallèles (voir « Tracés géométriques de base » en dessin descriptif).</li>
<li><b>Plans à l'échelle :</b> un plan au 1/50 est une réduction de rapport 1/50, donc des triangles semblables.</li>
<li><b>Distance inaccessible :</b> on construit un petit triangle semblable que l'on peut mesurer. Exemple : petit triangle de côtés 3 m et 4 m, grand triangle dont le côté qui correspond au 3 m vaut 12 m. Le rapport est 4, donc l'autre côté vaut 16 m.</li></ul>`,

function norm(s){return s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function buildIdx(){
  IDX=[];
  DATA.forEach((s,i)=>s.lessons.forEach((l,j)=>{
    const txt=((l.body||'').replace(/<[^>]+>/g,' ')+' '+l.q.map(q=>q.q+' '+q.e).join(' ')).replace(/\s+/g,' ').trim();
    IDX.push({i,j,t:norm(l.t),b:norm(txt),raw:txt,title:l.t,subj:s.nom,niv:l.niv});
  }));
}
const STOP=new Set('a au aux avec c calcul calcule calculer ce ces cet cette comment cours d dans de des donne donner du elle elles en est et exercice explique expliquer expliquez faire fait falloir faut i il ils j je l la le lecon les m ma me mes mon n ne nous on ou par pas plus pour pourquoi qu que quel quelle quelles quels question qui quoi s sa sans se ses son sont sous sur t ta te tes ton tres trouve trouver tu un une vous y'.split(' '));
function doSearch(q){
  if(!IDX)buildIdx();
  const toks=norm(q).split(/[^a-z0-9]+/).filter(w=>w.length>1&&!STOP.has(w));
  if(!toks.length)return[];
  return IDX.map(e=>{
    let sc=0;
    toks.forEach(w=>{if(e.t.includes(w))sc+=3;if(e.b.includes(w))sc+=1});
    return {e,sc,toks};
  }).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc).slice(0,8);
}
function snippet(e,toks){
  const nb=e.b;let p=-1;
  for(const w of toks){const k=nb.indexOf(w);if(k>=0){p=k;break}}
  if(p<0)return e.raw.slice(0,110)+'…';
  const a=Math.max(0,p-40);
  return (a>0?'…':'')+e.raw.slice(a,a+120)+'…';
}

function assistant(prefill){

  if(!turns.length){bubble('bot',sampleFn?"Bonjour ! Pose ta question sur le cours ou recopie ton TP. Je t'explique la méthode puis la solution.":"Bonjour ! Pose ta question avec des mots-clés, par exemple « Pythagore » ou « aire ».")}
  else turns.forEach(t=>bubble(t.role==='user'?'me':'bot',t.content));
  app.querySelector('.back').onclick=home;
  {const notice=document.createElement('p');notice.className='mut';notice.id='ainote';
    const off=navigator.onLine===false;
    if(!sampleFn)notice.textContent=off?'Pas de connexion Internet. L’assistant IA complet a besoin d’Internet et n’est pas inclus dans l’application installée. Assistant simplifié actif : il rappelle les formules principales et retrouve les leçons.':'L’assistant IA complet n’est pas inclus dans l’application installée : il a besoin d’Internet et d’un service IA. Assistant simplifié actif : il rappelle les formules principales et retrouve les leçons.';
    else if(off)notice.textContent='Pas de connexion Internet. L’assistant IA a besoin d’Internet : reconnecte-toi pour poser une question détaillée. En attendant, l’assistant simplifié répond hors ligne.';
    if(notice.textContent)chat.appendChild(notice)}
  const pic=document.getElementById('pic'),picb=document.getElementById('picb'),picn=document.getElementById('picn');
  if(picb){picb.onclick=()=>pic.click();pic.onchange=()=>{picn.textContent=pic.files[0]?pic.files[0].name:''}}
  stop.onclick=()=>{if(ctl)ctl.abort()};
  send.onclick=async()=>{
    const text=msg.value.trim();
    const file=pic&&pic.files&&pic.files[0]?pic.files[0]:null;
    if(!text&&!file)return;
    const content=text||"Voici la photo de mon exercice. Explique-moi la méthode puis donne la solution.";
    turns.push({role:'user',content});
    bubble('me',content+(file?'\n[photo jointe]':''));
    const bot=bubble('bot','Réflexion en cours…');
    msg.value='';send.disabled=true;stop.hidden=false;
    ctl=new AbortController();
    const opts={cache:false,signal:ctl.signal,onText:({text})=>{bot.textContent=text;bot.scrollIntoView({block:'nearest'})}};
    if(file)opts.images=file;
    try{
      if(typeof sampleFn!=='function'||navigator.onLine===false){
        const ans=(typeof sampleFn==='function'?'Pas de connexion Internet : l’assistant IA est indisponible. Aide simplifiée :\n\n':'')+localTutor(content);turns.push({role:'assistant',content:ans});bot.textContent=ans;
      }else{
        const r=await sampleFn([{role:'user',content:RULES},...turns.slice(-12)],opts);
        turns.push({role:'assistant',content:r.text});
        bot.textContent=r.text+(r.truncated?'\n\n(Réponse coupée. Demande la suite si besoin.)':'');
      }
    }catch(e){
      if(e&&e.text){bot.textContent=e.text+'\n\n(Réponse interrompue.)';turns.push({role:'assistant',content:e.text})}
      else if(e&&['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e.code)){
        const ans=localTutor(content);turns.push({role:'assistant',content:ans});bot.textContent=ans;
      }
      else{
        turns.pop();
        bot.textContent=(e&&e.code==='cancelled')?'Arrêté.':copyFor(e&&e.code);
        if(!msg.value)msg.value=text;
      }
    }finally{
      send.disabled=false;stop.hidden=true;ctl=null;
      if(pic){pic.value='';picn.textContent=''}
    }
  };
  if(prefill)msg.focus();
}

    [/\bthales\b/,'Thalès : si (MN) est parallèle à (BC), alors AM / AB = AN / AC = MN / BC. Écris les rapports dans le même ordre, puis fais le produit en croix.'],
    [/\b(surface|aire|aires)\b/,'Aires : rectangle = L × l ; triangle = base × hauteur ÷ 2 ; cercle = π × r² ; trapèze = (B + b) × h ÷ 2. Les unités sont au carré (m², cm²).'],
    [/\bvolumes?\b/,'Volumes : pavé = L × l × h ; prisme = aire de base × hauteur ; cylindre = π × r² × h ; pyramide ou cône = ⅓ × aire de base × h ; sphère = 4/3 × π × r³. Les unités sont cubiques (m³, cm³).'],
    [/\b(cercle|circonference|perimetre)\b/,'Cercle : périmètre = 2 × π × r ; aire = π × r². Rectangle : périmètre = 2 × (L + l).'],

    [/\b(concentration|dilution)\b/,'Concentration : C = n / V (mol/L). Dilution : C₁ × V₁ = C₂ × V₂.'],

    [/\b(force|forces|newton|poids)\b/,'Le poids se calcule par P = m × g (m en kg, g ≈ 9,8 N/kg). Une force se mesure en newtons (N). À l’équilibre, la somme des forces est nulle.'],
    [/\bpression\b/,'Pression : P = F / S, en pascals (1 Pa = 1 N/m²).'],
    [/\b(moment|levier)\b/,'Moment d’une force : M = F × d (en N·m), où d est le bras de levier. À l’équilibre, la somme des moments est nulle.'],
    [/\bpente\b/,'Pente (%) = hauteur ÷ longueur horizontale × 100. Angle du toit ou de la rampe : tan α = hauteur ÷ longueur horizontale.'],
    [/\bechelle\b/,'Échelle 1/100 : 1 cm sur le plan = 100 cm = 1 m dans la réalité. Plan = réel ÷ dénominateur ; réel = plan × dénominateur.'],
    [/\b(monge|epure|projection)\b/,'Épure de Monge : un point a deux projections, a sur le plan horizontal et a′ sur le plan vertical, alignées sur une ligne de rappel perpendiculaire à la ligne de terre (LT). La cote se mesure de a′ à LT, l’éloignement de a à LT.'],
    [/\b(createur|auteur|modeste|qui a (cree|developpe))\b/,'ArchiPrépa a été créée par Modeste MK, étudiant en architecture à l’U.KA, pour aider les nouveaux étudiants à s’adapter facilement à leurs cours.'],
    [/\b(bonjour|salut|bonsoir)\b/,'Bonjour ! Je peux rappeler des formules et retrouver les leçons d’ArchiPrépa.']
  ];
  R.forEach(([re,txt])=>{if(re.test(q))tips.push(txt)});
  const found=doSearch(question);
  if(found.length){tips.push('Leçons qui peuvent t’aider :');found.slice(0,3).forEach(x=>tips.push('- '+x.e.subj+' : '+x.e.title))}
  if(!tips.length)return 'Hors ligne, je ne peux pas répondre en détail à cette question. Essaie des mots-clés comme « Pythagore », « Thalès », « aire », « volume », « mole », « force » ou utilise la recherche de l’accueil pour retrouver une leçon.';
  return tips.join('\n\n');
}

function subject(i){
  const s=DATA[i];title.textContent=s.nom;
  app.innerHTML=`<button class="back">← Retour</button>`+s.lessons.map((l,j)=>({l,j})).filter(x=>filt==='Tous'||x.l.niv===filt).map(({l,j})=>{const b=best(i,j);return `<button class="card btn" data-l="${j}"><b>${l.t}</b><div class="mut"><span class="pill">${l.niv}</span> ${b!=null?'· meilleur score : '+b+'/'+l.q.length:'· pas encore fait'}</div></button>`}).join('');
  app.querySelector('.back').onclick=home;
  app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>lesson(i,+b.dataset.l));
}
function lesson(i,j){
  const l=DATA[i].lessons[j];title.textContent=DATA[i].nom;
  store.last=[i,j];save();
  app.innerHTML=`<button class="back">← Retour</button><div class="card"><h2>${l.t}</h2>${l.svg||''}${l.body}</div><button class="pri">Faire le quiz (${l.q.length} questions)</button>`;
  app.querySelector('.back').onclick=()=>subject(i);
  app.querySelector('.pri').onclick=()=>quiz(i,j,0,0);
  scrollTo(0,0);
}
function quiz(i,j,k,score){
  const l=DATA[i].lessons[j];
  if(k>=l.q.length){
    const prev=best(i,j);if(prev==null||score>prev){store[lkey(i,j)]=score;save()}
    app.innerHTML=`<div class="card"><h2>Résultat</h2><div class="big">${score} / ${l.q.length}</div><p style="text-align:center">${score===l.q.length?'Parfait !':score>=l.q.length/2?'Bien, continue !':'Relis la leçon et réessaie.'}</p></div>
    <button class="pri" id="r">Relire la leçon</button><button class="pri" id="a">Refaire le quiz</button><button class="pri" id="h">Accueil</button>`;
    document.getElementById('r').onclick=()=>lesson(i,j);
    document.getElementById('a').onclick=()=>quiz(i,j,0,0);
    document.getElementById('h').onclick=home;return;
  }
  const q=l.q[k];
  app.innerHTML=`<div class="mut">Question ${k+1} / ${l.q.length}</div><div class="card"><b>${q.q}</b>${q.o.map((o,n)=>`<button class="opt" data-n="${n}">${o}</button>`).join('')}<div class="exp" id="e"></div></div><button class="pri" id="nx" style="display:none">${k+1<l.q.length?'Suivant':'Voir le résultat'}</button>`;
  let done=false;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(done)return;done=true;const n=+b.dataset.n;
    app.querySelectorAll('.opt')[q.a].classList.add('ok');
    if(n!==q.a)b.classList.add('ko');
    document.getElementById('e').textContent=q.e;
    document.getElementById('nx').style.display='block';
    document.getElementById('nx').onclick=()=>quiz(i,j,k+1,score+(n===q.a?1:0));
  });
}

const ACC={bleu:{n:'Bleu',c:'#1b4f9c'},vert:{n:'Vert',c:'#1d6b4a'},violet:{n:'Violet',c:'#5b3fa6'},orange:{n:'Orange',c:'#b4501a'},rose:{n:'Rose',c:'#a8326b'}};
let profile=null;
try{profile=JSON.parse(localStorage.getItem('archiprepa_profile')||'null')}catch(e){profile=null}
function saveProfile(){try{localStorage.setItem('archiprepa_profile',JSON.stringify(profile))}catch(e){}}
function setAccentAttr(a){
  const r=document.documentElement;
  if(a&&a!=='bleu')r.setAttribute('data-accent',a);else r.removeAttribute('data-accent');
}
function applyAccent(){setAccentAttr(profile&&profile.accent)}
function swatches(el,cur,onPick){
  el.innerHTML=Object.keys(ACC).map(k=>`<button type="button" class="swb${k===cur?' on':''}" data-k="${k}" style="background:${ACC[k].c}" aria-label="${ACC[k].n}" aria-pressed="${k===cur}"></button>`).join('');
  el.querySelectorAll('.swb').forEach(b=>b.onclick=()=>{onPick(b.dataset.k);swatches(el,b.dataset.k,onPick)});
}
function levelTabs(el,cur,onPick){
  el.innerHTML=[['Prépa','Année prépa'],['L1','L1'],['Tous','Tous']].map(([k,l])=>`<button type="button" data-n="${k}" class="${k===cur?'on':''}">${l}</button>`).join('');
  el.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{onPick(b.dataset.n);levelTabs(el,b.dataset.n,onPick)});
}
function onboarding(){
  view='onboarding';title.textContent='ArchiPrépa';
  document.getElementById('gear').hidden=true;
  let niv='Prépa',acc='bleu';
  setAccentAttr('bleu');
  app.innerHTML=`<div class="card"><h2>Crée ton profil</h2>
  <p class="mut">Ton profil reste sur ton téléphone. Il sert à adapter l'app à ton niveau et à garder ta progression.</p>
  <label for="pn">Prénom</label>
  <input id="pn" class="srch" type="text" maxlength="30" autocomplete="given-name" placeholder="Ton prénom">
  <div class="lbl">Niveau</div><div class="tabs" id="nv"></div>
  <div class="lbl">Couleur de l'interface</div><div class="sw" id="sw"></div>
  <div class="err" id="er" role="alert"></div>
  <button class="pri" id="go" type="button">Commencer</button></div>`;
  levelTabs(document.getElementById('nv'),niv,v=>{niv=v});
  swatches(document.getElementById('sw'),acc,v=>{acc=v;setAccentAttr(v)});
  const go=()=>{
    const name=document.getElementById('pn').value.trim();
    if(!name){document.getElementById('er').textContent='Écris ton prénom pour continuer.';document.getElementById('pn').focus();return}
    profile={name,niv,accent:acc};saveProfile();
    filt=niv;document.getElementById('gear').hidden=false;home();
  };
  document.getElementById('go').onclick=go;
  document.getElementById('pn').onkeydown=e=>{if(e.key==='Enter')go()};
}
function twoStep(btn,labelAfter,action){
  const first=btn.textContent;let armed=false,t=null;
  btn.onclick=()=>{
    if(!armed){armed=true;btn.textContent=labelAfter;t=setTimeout(()=>{armed=false;btn.textContent=first},4000);return}
    clearTimeout(t);action();
  };
}
function settings(){
  view='settings';title.textContent='Réglages';
  let niv=profile.niv||'Prépa',acc=profile.accent||'bleu';
  app.innerHTML=`<button class="back">← Retour</button>
  <div class="card"><h2>Mon profil</h2>
  <label for="pn">Prénom</label>
  <input id="pn" class="srch" type="text" maxlength="30" value="${esc(profile.name||'')}">
  <div class="lbl">Niveau</div><div class="tabs" id="nv"></div>
  <div class="lbl">Couleur de l'interface</div><div class="sw" id="sw"></div>
  <div class="err" id="er" role="alert"></div><div class="ok" id="okm" role="status"></div>
  <button class="pri" id="sv" type="button">Enregistrer</button></div>
  <div class="card"><b>Progression</b><p class="mut">Efface tes scores de quiz sur cet appareil.</p><button class="sec" id="rp" type="button">Effacer ma progression</button></div>
  <div class="card"><b>Changer de profil</b><p class="mut">Supprime ton profil et revient à l'écran de création.</p><button class="sec" id="rm" type="button">Supprimer mon profil</button></div>`;
  levelTabs(document.getElementById('nv'),niv,v=>{niv=v});
  swatches(document.getElementById('sw'),acc,v=>{acc=v;setAccentAttr(v)});
  app.querySelector('.back').onclick=()=>{applyAccent();home()};
  document.getElementById('sv').onclick=()=>{
    const name=document.getElementById('pn').value.trim();
    if(!name){document.getElementById('er').textContent='Le prénom ne peut pas être vide.';return}
    profile={name,niv,accent:acc};saveProfile();filt=niv;
    document.getElementById('er').textContent='';
    document.getElementById('okm').textContent='Réglages enregistrés.';
  };
  twoStep(document.getElementById('rp'),'Appuie encore pour confirmer',()=>{store={};save();home()});
  twoStep(document.getElementById('rm'),'Appuie encore pour confirmer',()=>{
    profile=null;try{localStorage.removeItem('archiprepa_profile')}catch(e){}
    store={};save();turns=[];onboarding();
  });
}

function about(){
  view='about';title.textContent='À propos';
  app.innerHTML=`<button class="back">← Retour</button>
  <div class="card"><img class="logo-big" src="${LOGO}" alt="Logo d'ArchiPrépa"><h2 class="ctr">ArchiPrépa</h2>
  <div class="lbl">Créateur</div>
  <div class="creator"><img class="avatar sm" src="${AVATAR}" alt="Photo de Modeste MK"><div><b>Modeste MK</b><div class="mut">Étudiant en architecture à l'U.KA</div></div></div>
  <p>Il a créé cette application pour aider les nouveaux étudiants en architecture à s'adapter facilement à leurs cours.</p>
  <div class="lbl">Contenu</div>
  <p class="mut">Chimie, dessin descriptif, mathématiques, géométrie, physique, matériaux de construction et histoire de l'architecture, pour l'année préparatoire et la L1.</p></div>`;
  app.querySelector('.back').onclick=home;
}

let deferredInstall=null;
const IS_FRAME=(()=>{try{return window.top!==window}catch(e){return true}})();
const IS_STANDALONE=(()=>{try{return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}})();
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(view==='home'){const q=document.getElementById('q');if(!q||!q.value)home()}});
window.addEventListener('appinstalled',()=>{deferredInstall=null;if(view==='home')home()});
function installCard(){
  if(IS_FRAME||IS_STANDALONE||!deferredInstall)return '';
  return '<button class="card btn" id="inst" type="button"><b>Installer ArchiPrépa</b><div class="exp">Ajoute l\'app sur ton écran d\'accueil. Elle marche sans internet.</div></button>';
}
function resumeCard(){
  const l=store.last;
  if(!Array.isArray(l)||!DATA[l[0]]||!DATA[l[0]].lessons[l[1]])return '';
  return '<button class="card btn" id="resume" type="button"><b>Reprendre</b><div class="mut">'+esc(DATA[l[0]].nom)+' · '+esc(DATA[l[0]].lessons[l[1]].t)+'</div></button>';
}
function netUI(){const b=document.getElementById('offb');if(b)b.hidden=navigator.onLine!==false}
window.addEventListener('online',netUI);
window.addEventListener('offline',netUI);
async function start(){
  applyAccent();
  netUI();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  const hl=document.getElementById('hlogo');if(hl)hl.src=LOGO;
  const g=document.getElementById('gear');
  g.onclick=()=>{if(profile)settings()};
  if(profile){g.hidden=false;filt=profile.niv||'Tous';home();return}
  let owner=false;
  if(window.claude&&window.claude.use){
    app.innerHTML='<p class="mut">Chargement…</p>';
    try{
      const u=await Promise.race([window.claude.use('user'),new Promise(r=>setTimeout(()=>r(null),2500))]);
      const v=u&&u.isOwner?u.isOwner():false;
      owner=(await Promise.resolve(v))===true;
    }catch(e){owner=false}
  }
  if(owner){
    profile={name:'Modeste',niv:'Tous',accent:'bleu',owner:true};saveProfile();
    g.hidden=false;filt='Tous';home();
  }else onboarding();
}

start();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
